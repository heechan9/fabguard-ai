name: Maintenance context review UI
on:
  push:
    branches: [feat/maintenance-baseline-review]
    paths: ['web/equipment/**', 'src/fabguard/maintenance_review.py', 'examples/manufacturing/maintenance_history_synthetic.json', 'verification/check_context_review.cjs', '.github/workflows/context-review-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1366, 390, 360]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project, installed Chrome and Korean fonts
        run: |
          python -m pip install .
          command -v google-chrome
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Isolated test driver without browser download
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/context-driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Check synthetic fixture from original inputs
        env:
          PYTHONPATH: src
        run: |
          python -m fabguard.maintenance_review build --input examples/manufacturing/smt_synthetic_events.json --history examples/manufacturing/maintenance_history_synthetic.json --baseline-count 10 --as-of 2026-09-01T00:20:00Z --output "$RUNNER_TEMP/context-package.json"
          cmp web/equipment/data/maintenance-synthetic.json "$RUNNER_TEMP/context-package.json"
      - name: Loopback browser and downloaded-decision CLI round trip
        env:
          FABGUARD_UI_WIDTH: ${{ matrix.width }}
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/context-review-ui
        run: |
          python3 -m http.server 8764 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/context-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          NODE_PATH="$RUNNER_TEMP/context-driver/node_modules" timeout 180s node verification/check_context_review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-review-${{ matrix.width }}-${{ github.sha }}
          path: ${{ runner.temp }}/context-review-ui
          retention-days: 14
