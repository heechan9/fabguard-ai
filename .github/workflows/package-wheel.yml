name: Installed wheel candidate

on:
  pull_request:
    paths:
      - '.github/workflows/package-wheel.yml'
      - 'verification/check_installed_wheel.py'
      - 'pyproject.toml'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-wheel.yml'
      - 'verification/check_installed_wheel.py'
      - 'pyproject.toml'
      - 'src/**'

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build only the candidate wheel
        run: |
          python -m pip install setuptools==75.8.0 wheel==0.45.1
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel" .
      - name: Test genuine wheel and synthetic missing-file control
        env:
          PYTHONPATH: ""
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/wheel/*.whl)
          test "${#files[@]}" -eq 1
          python -I verification/check_installed_wheel.py "${files[0]}" --output "$RUNNER_TEMP/wheel/verification.json"
      - name: Preserve only the verified wheel and its receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fabguard-wheel-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wheel/*.whl
            ${{ runner.temp }}/wheel/verification.json
          if-no-files-found: error
