name: Claude PR audit requests

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude-audit:
    # Only the repository owner's @claude comments on PRs can start a run.
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'heechan9' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Diagnose OAuth secret (never prints the value)
        env:
          TOKEN_VALUE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or unset for this workflow. Check that it is a REPOSITORY secret (Settings > Secrets and variables > Actions), not an Environment secret, since this job declares no 'environment:'."
            exit 1
          fi
          RAW_LEN=${#TOKEN_VALUE}
          TRIMMED="$(printf '%s' "$TOKEN_VALUE" | tr -d '[:space:]')"
          TRIMMED_LEN=${#TRIMMED}
          echo "Secret is set. raw_length=$RAW_LEN trimmed_length=$TRIMMED_LEN"
          if [ "$RAW_LEN" != "$TRIMMED_LEN" ]; then
            echo "::warning::Secret contains leading/trailing whitespace or a newline character (raw_length != trimmed_length). Re-copy the token value without extra whitespace and re-save the secret."
          fi

          FIRST_BYTES_HEX="$(printf '%s' "$TOKEN_VALUE" | od -An -tx1 | tr -d ' \n' | cut -c1-6)"
          if [ "$FIRST_BYTES_HEX" = "efbbbf" ]; then
            echo "::warning::Secret begins with a UTF-8 BOM (EF BB BF). This is commonly added by Windows PowerShell redirection (> file.txt) or Notepad when saving as UTF-8. Re-copy the token directly from the terminal (not via a file) and re-save the secret."
          fi

          PRINTABLE_LEN="$(printf '%s' "$TOKEN_VALUE" | LC_ALL=C tr -cd '\040-\176' | wc -c | tr -d ' ')"
          NON_ASCII_COUNT=$((RAW_LEN - PRINTABLE_LEN))
          echo "non_printable_ascii_char_count=$NON_ASCII_COUNT"
          if [ "$NON_ASCII_COUNT" != "0" ]; then
            echo "::warning::Secret contains $NON_ASCII_COUNT character(s) outside the printable ASCII range (0x20-0x7E). This can be a BOM, smart quote, non-breaking space, zero-width space, or stray CR, none of which are caught by whitespace-only trimming. Re-copy the token without going through a text editor or a file redirect, then re-save the secret."
          fi

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Repository admin: install the Claude GitHub App and add this secret
          # under Settings > Secrets and variables > Actions.
          # Generate a token locally with `claude setup-token` (Claude Pro/Max).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode plan
            --max-turns 20
            --append-system-prompt "For FabGuard PR audits, inspect only. Do not edit files, commit, push, open or merge PRs. Report findings with file paths, lines, evidence, and unverified limits in the PR."
