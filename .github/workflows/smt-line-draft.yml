name: SMT line draft comparison
on:
  push:
    branches: [draft-smt-line-20261119]
    paths: ['.github/workflows/smt-line-draft.yml', 'web/smt/**', 'verification/compare_line_draft.cjs','tests/web/**']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [360, 1366]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 74309653e3740080f133ca4ed4c443ec1648529e
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare renderer
        run: |
          bash verification/prepare_korean_fonts.sh
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Verify local build and capture matched views
        env:
          WIDTH: ${{ matrix.width }}
        run: |
          node --test tests/web/*.test.mjs > "$RUNNER_TEMP/tests.log" || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -9 "$RUNNER_TEMP/tests.log"
          python3 -m http.server 8774 --bind 127.0.0.1 --directory baseline/web > "$RUNNER_TEMP/baseline-http.log" 2>&1 &
          BASE_SERVER=$!
          python3 -m http.server 8775 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/draft-http.log" 2>&1 &
          DRAFT_SERVER=$!
          trap 'kill "$BASE_SERVER" "$DRAFT_SERVER"' EXIT
          for p in 8774 8775; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$p/smt/" > /dev/null; then break; fi
              sleep .2
            done
          done
          NODE_PATH="$RUNNER_TEMP/driver/node_modules" node verification/compare_line_draft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-qa-${{ matrix.width }}
          path: line-qa-${{ matrix.width }}/
          retention-days: 14
