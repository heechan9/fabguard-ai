name: SECOM offline review browser verification
on:
  pull_request:
    paths: ['web/review/**', 'web/app.js', 'verification/check_secom_review*', 'tests/web/secom-review.test.mjs', 'scripts/build_secom_review_source.py', '.github/workflows/secom-offline-review-ui.yml']
  push:
    branches: [main]
    paths: ['web/review/**', 'web/app.js', 'verification/check_secom_review*', '.github/workflows/secom-offline-review-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing Chrome and fonts
        run: |
          command -v google-chrome
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Isolated driver only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/secom-driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Pinned source and local browser checks
        env:
          FABGUARD_BASE_URL: http://127.0.0.1:8769
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/secom-loopback
        run: |
          python scripts/build_secom_review_source.py
          node --test tests/web/secom-review.test.mjs
          python -m http.server 8769 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/secom-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8769/review/ > /dev/null; then break; fi
            sleep 0.25
          done
          NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 420s node verification/check_secom_review.cjs
      - name: Production owned-assets gate
        if: github.event_name == 'push'
        run: python verification/check_secom_review_assets.py --output "$RUNNER_TEMP/secom-production-assets.json"
      - name: Production browser checks
        if: github.event_name == 'push'
        env:
          FABGUARD_BASE_URL: https://fabguard-ai.vercel.app
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/secom-production
        run: NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 420s node verification/check_secom_review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secom-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/secom-loopback
            ${{ runner.temp }}/secom-production
            ${{ runner.temp }}/secom-production-assets.json
            ${{ runner.temp }}/secom-server.log
          retention-days: 14
