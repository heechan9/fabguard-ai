name: SECOM offline review browser verification
on:
  pull_request:
    paths: ['web/theme.js', 'web/review/**', 'web/app.js', 'verification/check_secom_review*', 'tests/web/secom-review.test.mjs', 'tests/web/secom-handoff*.test.mjs', 'tests/web/review-budget.test.mjs', 'web/review-budget*.mjs', 'web/english-copy.mjs', 'verification/check_review_budget.cjs', 'verification/check_english_ui.cjs', 'scripts/build_secom_review_source.py', '.github/workflows/secom-offline-review-ui.yml']
  push:
    branches: [main]
    paths: ['web/theme.js', 'web/review/**', 'web/app.js', 'web/review-budget*.mjs', 'web/english-copy.mjs', 'verification/check_review_budget.cjs', 'verification/check_english_ui.cjs', 'verification/check_secom_review*', '.github/workflows/secom-offline-review-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Existing Chrome and fonts
        run: |
          command -v google-chrome
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Isolated driver only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/secom-driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Pinned source and local browser checks
        env:
          FABGUARD_BASE_URL: http://127.0.0.1:8769
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/secom-loopback
        run: |
          python scripts/build_secom_review_source.py
          node --test tests/web/secom-review.test.mjs tests/web/secom-handoff*.test.mjs tests/web/review-budget.test.mjs tests/web/english-copy.test.mjs
          python -m http.server 8769 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/secom-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8769/review/ > /dev/null; then break; fi
            sleep 0.25
          done
          NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 420s node verification/check_secom_review.cjs
          NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 240s node verification/check_secom_review_handoff.cjs
          for width in 1366 390 360; do
            FABGUARD_UI_WIDTH="$width" FABGUARD_UI_OUTPUT="$FABGUARD_UI_OUTPUT/budget-$width" NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 120s node verification/check_review_budget.cjs
            FABGUARD_UI_WIDTH="$width" FABGUARD_UI_OUTPUT="$FABGUARD_UI_OUTPUT/english-$width" NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 180s node verification/check_english_ui.cjs
          done
      - name: Production owned-assets gate
        if: github.event_name == 'push'
        run: python verification/check_secom_review_assets.py --output "$RUNNER_TEMP/secom-production-assets.json"
      - name: Production browser checks
        if: github.event_name == 'push'
        env:
          FABGUARD_BASE_URL: https://fabguard-ai.vercel.app
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/secom-production
        run: |
          NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 420s node verification/check_secom_review.cjs
          NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 240s node verification/check_secom_review_handoff.cjs
          for width in 1366 390 360; do
            FABGUARD_UI_WIDTH="$width" FABGUARD_UI_OUTPUT="$FABGUARD_UI_OUTPUT/budget-$width" NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 120s node verification/check_review_budget.cjs
            FABGUARD_UI_WIDTH="$width" FABGUARD_UI_OUTPUT="$FABGUARD_UI_OUTPUT/english-$width" NODE_PATH="$RUNNER_TEMP/secom-driver/node_modules" timeout 180s node verification/check_english_ui.cjs
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secom-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/secom-loopback
            ${{ runner.temp }}/secom-production
            ${{ runner.temp }}/secom-production-assets.json
            ${{ runner.temp }}/secom-server.log
          retention-days: 14
