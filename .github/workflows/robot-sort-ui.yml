name: Synthetic robot sorting UI
on:
  pull_request:
    paths: ['web/**', 'verification/check_robot_sort_cell.cjs', 'verification/check_transfer_robot.cjs', 'verification/check_floor_agv.cjs', '.github/workflows/robot-sort-ui.yml']
  push:
    branches: [feat/synthetic-robot-sort-cell]
    paths: ['web/smt/**', 'verification/check_robot_sort_cell.cjs', 'verification/check_transfer_robot.cjs', 'verification/check_floor_agv.cjs', '.github/workflows/robot-sort-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1366, 390, 360]
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Chrome and Korean font support
        run: |
          command -v google-chrome
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Isolated test driver (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/robot-driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Loopback browser verification
        env:
          FABGUARD_UI_WIDTH: ${{ matrix.width }}
          FABGUARD_BROWSER_PATH: /usr/bin/google-chrome
          FABGUARD_UI_OUTPUT: ${{ runner.temp }}/robot-sort-ui
        run: |
          python3 -m http.server 8764 --bind 127.0.0.1 --directory web > "$RUNNER_TEMP/robot-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          NODE_PATH="$RUNNER_TEMP/robot-driver/node_modules" timeout 360s node verification/check_robot_sort_cell.cjs
          NODE_PATH="$RUNNER_TEMP/robot-driver/node_modules" timeout 360s node verification/check_transfer_robot.cjs
          NODE_PATH="$RUNNER_TEMP/robot-driver/node_modules" timeout 360s node verification/check_floor_agv.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-sort-ui-${{ matrix.width }}-${{ github.sha }}
          path: ${{ runner.temp }}/robot-sort-ui
          retention-days: 14
