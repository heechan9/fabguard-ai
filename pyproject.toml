[project]
name = "fabguard-ai"
version = "0.1.0"
description = "Leakage-safe semiconductor manufacturing risk prioritization portfolio project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.scripts]
fabguard-audit = "fabguard.data:main"
fabguard-run = "fabguard.experiment:main"
fabguard-report = "fabguard.reporting:main"
fabguard-advanced = "fabguard.advanced_experiment:main"
fabguard-fledge-smoke = "fabguard.integrations.fledge_smoke:main"
fabguard-fledge-operations = "fabguard.integrations.fledge_operations_cli:main"
fabguard-fledge-benchmark = "fabguard.integrations.fledge_benchmark:main"
fabguard-independent-validate = "fabguard.independent_validation:main"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
